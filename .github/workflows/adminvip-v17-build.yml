name: Build AdminVipMenuCS2 v17

on:
  workflow_dispatch:
  push:
    branches: [wintersnow-ready]
    paths:
      - 'AdminVipMenuCS2-v17-SOURCE.zip'
      - '.github/workflows/adminvip-v17-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Extract source
        run: |
          rm -rf adminvip_v17_src out package
          mkdir -p adminvip_v17_src
          unzip -o AdminVipMenuCS2-v17-SOURCE.zip -d adminvip_v17_src
          echo '--- Integrated settings ---'
          grep -R -n -E 'css_admin|AdminUnlockSeconds|WinterDust2WorkshopId|WinterMirageWorkshopId' adminvip_v17_src || true
          echo '--- Source tree ---'
          find adminvip_v17_src -maxdepth 3 -type f -print
      - name: Build
        run: |
          CSPROJ=$(find adminvip_v17_src -name 'AdminVipMenuCS2.csproj' -print -quit)
          test -n "$CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o out
      - name: Package
        run: |
          mkdir -p package/AdminVipMenuCS2
          cp out/AdminVipMenuCS2.dll package/AdminVipMenuCS2/
          if [ -f out/AdminVipMenuCS2.deps.json ]; then cp out/AdminVipMenuCS2.deps.json package/AdminVipMenuCS2/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AdminVipMenuCS2-v17-READY
          path: package/
