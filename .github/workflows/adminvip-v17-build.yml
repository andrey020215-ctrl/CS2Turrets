name: Build AdminVipMenuCS2 v17

on:
  workflow_dispatch:
  push:
    branches: [wintersnow-ready]
    paths:
      - '.ci/adminvip_v17_zip/**'
      - '.github/workflows/adminvip-v17-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild and verify source archive
        run: |
          rm -rf adminvip_v17_src out package AdminVipMenuCS2-v17-GOOD.zip
          mkdir -p adminvip_v17_src
          cat .ci/adminvip_v17_zip/part*.b64 | tr -d '\r\n' | base64 -d > AdminVipMenuCS2-v17-GOOD.zip
          unzip -t AdminVipMenuCS2-v17-GOOD.zip
          unzip -o AdminVipMenuCS2-v17-GOOD.zip -d adminvip_v17_src
          echo '--- Integrated settings ---'
          grep -R -n -E 'css_admin|AdminUnlockSeconds|WinterDust2WorkshopId|WinterMirageWorkshopId' adminvip_v17_src || true
      - name: Local-test admin access patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = next(Path("adminvip_v17_src").rglob("AdminVipMenuCS2.cs"))
          s = p.read_text(encoding="utf-8-sig")
          s2, n = re.subn(
              r'private bool IsAdmin\(CCSPlayerController p\)\s*=>\s*AdminManager\.PlayerHasPermissions\(p, Config\.AdminPermission\)\s*\|\|\s*AdminManager\.PlayerHasPermissions\(p, "@css/root"\);',
              'private bool IsAdmin(CCSPlayerController p) => Usable(p);',
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit("Could not patch IsAdmin for local test build")
          p.write_text(s2, encoding="utf-8")
          print("Patched IsAdmin: local test = any usable human player.")
          PY
      - name: Build
        run: |
          CSPROJ=$(find adminvip_v17_src -name 'AdminVipMenuCS2.csproj' -print -quit)
          test -n "$CSPROJ"
          dotnet publish "$CSPROJ" -c Release -o out
      - name: Package
        run: |
          mkdir -p package/AdminVipMenuCS2
          cp out/AdminVipMenuCS2.dll package/AdminVipMenuCS2/
          if [ -f out/AdminVipMenuCS2.deps.json ]; then cp out/AdminVipMenuCS2.deps.json package/AdminVipMenuCS2/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AdminVipMenuCS2-v17-READY
          path: package/
